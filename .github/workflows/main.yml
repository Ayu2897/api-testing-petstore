name: Run API Tests
on: [push]  # Jalankan test tiap ada perubahan

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Setup Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '16'

      - name: Install Newman
        run: npm install -g newman

      - name: Run Tests
        run: |
          newman run petstore_tests.json --reporters=cli,html --reporter-html-export report.html

      - name: Upload Report
        uses: actions/upload-artifact@v2
        with:
          name: Test-Report
          path: report.html
